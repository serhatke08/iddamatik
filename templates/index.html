<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İddaa Matik - Oranlar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ İddaa Matik</h1>
            <p class="subtitle">Güncel İddaa Oranları ve Maç Programı</p>
        </header>

        <div class="controls">
            <div class="date-selector">
                <label for="dateInput">Tarih Seçin:</label>
                <input type="date" id="dateInput" value="{{ today }}">
                <button id="loadBtn" class="btn-primary">Yükle</button>
            </div>
            <div class="refresh-controls">
                <button id="refreshBtn" class="btn-secondary">🔄 Yenile</button>
                <span id="lastUpdate" class="last-update"></span>
            </div>
        </div>

        <div class="search-section">
            <h2>🔍 Geçmiş Maç Arama</h2>
            <div class="search-form">
                <div class="form-group">
                    <label for="teamSearch">Takım Adı:</label>
                    <input type="text" id="teamSearch" placeholder="Örn: Galatasaray, Fenerbahçe...">
                </div>
                <div class="form-group">
                    <label for="leagueSearch">Lig:</label>
                    <input type="text" id="leagueSearch" placeholder="Örn: Süper Lig, Premier League...">
                </div>
                <div class="form-group">
                    <label for="dateFrom">Başlangıç Tarihi:</label>
                    <input type="date" id="dateFrom">
                </div>
                <div class="form-group">
                    <label for="dateTo">Bitiş Tarihi:</label>
                    <input type="date" id="dateTo">
                </div>
                <button id="searchBtn" class="btn-primary">🔍 Ara</button>
                <button id="clearSearchBtn" class="btn-secondary">Temizle</button>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Maçlar yükleniyor...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="matchesContainer" class="matches-container">
            <!-- Maçlar buraya yüklenecek -->
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
